<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="x-apple-disable-message-reformatting">
<title>%%SUBJECT%%</title>
<style>
  @media only screen and (max-width: 620px) {
    .container { width: 100% !important; }
    .col { display: block !important; width: 100% !important; }
    .px { padding-left: 16px !important; padding-right: 16px !important; }
  }
</style>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f4;">
<div style="display:none; max-height:0; overflow:hidden; mso-hide:all;">%%PREHEADER%%</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f4f4;">
  <tr>
    <td align="center" style="padding:16px 0;">
      <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; background-color:#ffffff; font-family:Arial, Helvetica, sans-serif; color:#222222;">
        <tr>
          <td class="px" align="right" style="padding:8px 24px; font-size:12px;">
            <a href="{{ email.view }}" style="color:#666666;">View in browser</a>
          </td>
        </tr>
        <tr>
          <td class="px" align="center" style="padding:16px 24px;">
            <a href="%%SITE_URL%%"><img src="%%LOGO_URL%%" alt="%%BRAND_NAME%%" width="160" style="display:block; border:0; width:160px; max-width:100%; height:auto;"></a>
          </td>
        </tr>
        <tr>
          <td class="px" style="padding:8px 24px;">
            <h1 style="margin:0 0 12px; font-size:26px; line-height:1.25;">%%HEADLINE%%</h1>
            <p style="margin:0 0 16px; font-size:16px; line-height:1.5;">%%INTRO%%</p>
          </td>
        </tr>
        %%OFFER_BLOCK%%
        %%PRODUCTS_BLOCK%%
        <tr>
          <td class="px" align="center" style="padding:16px 24px 32px;">
            <a href="%%CTA_URL%%" style="display:inline-block; padding:14px 28px; background-color:#222222; color:#ffffff; font-size:16px; font-weight:bold; text-decoration:none; border-radius:4px;">%%CTA_TEXT%%</a>
          </td>
        </tr>
        <tr>
          <td class="px" style="padding:16px 24px 24px; border-top:1px solid #e5e5e5; font-size:12px; line-height:1.5; color:#666666;" align="center">
            <p style="margin:0 0 8px;">%%BRAND_NAME%% &middot; %%POSTAL_ADDRESS%%</p>
            <p style="margin:0;">You're receiving this because you subscribed to %%BRAND_NAME%% emails.
              <a href="%%UNSUBSCRIBE_URL%%" style="color:#666666;">Unsubscribe or manage preferences</a></p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
